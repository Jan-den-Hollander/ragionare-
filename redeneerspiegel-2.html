<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redeneerspiegel</title>
<meta name="theme-color" content="#12151b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151b; --surface:#1a1f28; --surface-2:#20262f; --border:#2c333e;

    --feit:#5b93b8; --feit-soft:#5b93b822;
    --redenering:#c9a24a; --redenering-soft:#c9a24a22;
    --interpretatie:#9b7fc4; --interpretatie-soft:#9b7fc422;
    --warn:#c46a5a;
  }

  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased;padding-bottom:98px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{padding:22px 20px 14px;border-bottom:1px solid var(--border);}
  .taal-rij{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .taal-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:1.05rem;line-height:1;position:relative;}
  .taal-btn.active{border-color:var(--redenering);background:var(--redenering-soft);}
  .taal-btn.meer .badge{position:absolute;top:-5px;right:-5px;font-size:0.5rem;background:var(--redenering);color:#1a1408;border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;}
  header h1{margin:0 0 6px;font-weight:600;font-size:1.5rem;letter-spacing:-0.01em;}
  header p.tag{margin:0;color:var(--ink-dim);font-size:0.95rem;line-height:1.55;max-width:60ch;}
  .disclaimer{margin:16px 20px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--redenering);border-radius:4px;font-size:0.9rem;line-height:1.6;color:var(--ink-dim);}
  main{padding:20px;max-width:640px;margin:0 auto;}
  section{display:none;}
  section.active{display:block;}
  .stelling-box{font-style:italic;font-size:1.12rem;line-height:1.6;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:22px;}
  .laag{margin-bottom:22px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);}
  .laag-kop{display:flex;align-items:center;gap:10px;padding:12px 16px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;letter-spacing:0.01em;color:var(--ink);}
  .laag-kop .icoon{font-size:1rem;}
  .laag.feit .laag-kop{background:var(--feit-soft);}
  .laag.redenering .laag-kop{background:var(--redenering-soft);}
  .laag.interpretatie .laag-kop{background:var(--interpretatie-soft);}
  .laag-body{padding:6px 16px 14px;}
  .item{padding:12px 0;border-top:1px solid var(--border);font-size:0.98rem;line-height:1.6;}
  .item:first-child{border-top:none;}
  .item .label{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-dim);display:block;margin-bottom:4px;}
  .bron{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--ink-dim);margin-top:6px;}
  .tegengeluid{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:4px;font-size:0.9rem;color:var(--ink-dim);display:none;}
  .tegengeluid.open{display:block;}
  .tg-btn{margin-top:8px;background:none;border:1px solid var(--border);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:5px 10px;border-radius:4px;}
  .tg-btn:active{background:var(--surface-2);}
  textarea,input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);font-family:'Fraunces',serif;font-size:1rem;padding:10px 12px;border-radius:5px;resize:vertical;}
  label.field{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-dim);margin:16px 0 6px;}
  .addbtn{margin-top:8px;background:var(--surface-2);border:1px dashed var(--border);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:0.78rem;padding:8px 12px;border-radius:5px;width:100%;}
  .primary{margin-top:24px;width:100%;background:var(--redenering);color:#1a1408;border:none;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:0.85rem;padding:13px;border-radius:6px;}
  .rij{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .rij input{flex:1;}
  .del{background:none;border:none;color:var(--warn);font-size:1.1rem;padding:6px 8px;line-height:1;}
  .lib-item{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;}
  .lib-item .titel{font-size:1.02rem;line-height:1.45;}
  .lib-item .meta{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--ink-dim);margin-top:6px;}
  .lib-item .acties{display:flex;gap:8px;margin-top:10px;}
  .lib-item button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:6px 10px;border-radius:4px;}
  .leeg{color:var(--ink-dim);font-size:0.92rem;padding:30px 0;text-align:center;}
  .over p{line-height:1.7;font-size:0.98rem;color:var(--ink-dim);}
  h2.sectiontitel{font-size:1.15rem;font-weight:600;margin:0 0 16px;}
  .bottom-fixed{position:fixed;bottom:0;left:0;right:0;z-index:10;}
  .copybar{background:var(--surface-2);border-top:1px solid var(--border);text-align:center;padding:5px 0;font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--ink-dim);}
  nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs button{flex:1;background:none;border:none;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:0.68rem;padding:12px 4px 10px;letter-spacing:0.01em;}
  nav.tabs button.active{color:var(--redenering);}
  #blok-overlay{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:'IBM Plex Mono',monospace;font-size:0.9rem;line-height:1.6;z-index:9999;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto;}
  .modal-kop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-kop h3{margin:0;font-size:1.05rem;font-weight:600;}
  .modal-close{background:none;border:none;color:var(--ink-dim);font-size:1.3rem;line-height:1;padding:4px 6px;}
  .taal-lijst-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-family:'Fraunces',serif;font-size:0.98rem;color:var(--ink);text-align:left;}
  .taal-lijst-btn .vlag{font-size:1.2rem;}
  .prompt-tekst{width:100%;min-height:180px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:0.82rem;line-height:1.5;padding:10px;border-radius:6px;resize:vertical;}
  .plak-instructie{font-size:0.86rem;color:var(--ink-dim);line-height:1.55;margin:10px 0 14px;}
  .kopieer-btn{width:100%;background:var(--redenering);color:#1a1408;border:none;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:0.85rem;padding:12px;border-radius:6px;}
</style>
</head>
<body>

<header>
  <div class="taal-rij" id="taal-rij"></div>
  <h1 id="tx-appname">Redeneerspiegel</h1>
  <p class="tag" id="tx-tagline"></p>
</header>

<div class="disclaimer" id="tx-disclaimer"></div>

<main>

  <section id="voorbeeld" class="active">
    <h2 class="sectiontitel" id="tx-voorbeeldtitel"></h2>
    <div class="stelling-box" id="voorbeeld-stelling"></div>
    <div id="voorbeeld-lagen"></div>
  </section>

  <section id="nieuw">
    <h2 class="sectiontitel" id="tx-nieuwtitel"></h2>
    <label class="field" id="tx-labelstelling"></label>
    <textarea id="n-stelling" rows="3"></textarea>

    <label class="field" style="margin-top:24px;" id="tx-labelfeit"></label>
    <div id="n-feit"></div>
    <button class="addbtn" id="btn-addfeit" onclick="addItem('feit')"></button>

    <label class="field" style="margin-top:24px;" id="tx-labelredenering"></label>
    <div id="n-redenering"></div>
    <button class="addbtn" id="btn-addredenering" onclick="addItem('redenering')"></button>

    <label class="field" style="margin-top:24px;" id="tx-labelinterpretatie"></label>
    <div id="n-interpretatie"></div>
    <button class="addbtn" id="btn-addinterpretatie" onclick="addItem('interpretatie')"></button>

    <button class="primary" id="btn-bewaar" onclick="opslaan()"></button>
  </section>

  <section id="bib">
    <h2 class="sectiontitel" id="tx-bibtitel"></h2>
    <div id="bib-lijst"></div>
  </section>

  <section id="over">
    <h2 class="sectiontitel" id="tx-overtitel"></h2>
    <div class="over">
      <p id="tx-overp1"></p>
      <p id="tx-overp2"></p>
      <p id="tx-overp3"></p>
      <p id="tx-overp4"></p>
    </div>
  </section>

</main>

<div class="bottom-fixed">
  <div class="copybar" id="copyright-footer">&copy; 2026 Jan den Hollander</div>
  <nav class="tabs">
    <button data-s="voorbeeld" class="active" id="tab-voorbeeld" onclick="toon('voorbeeld')"></button>
    <button data-s="nieuw" id="tab-nieuw" onclick="toon('nieuw')"></button>
    <button data-s="bib" id="tab-bib" onclick="toon('bib')"></button>
    <button data-s="over" id="tab-over" onclick="toon('over')"></button>
  </nav>
</div>

<div class="modal-overlay" id="vertaal-modal">
  <div class="modal-box">
    <div class="modal-kop">
      <h3 id="tx-kiestaaltitel"></h3>
      <button class="modal-close" aria-label="close" onclick="sluitModal('vertaal-modal')">&times;</button>
    </div>
    <div id="vertaal-lijst"></div>
  </div>
</div>

<div class="modal-overlay" id="prompt-modal">
  <div class="modal-box">
    <div class="modal-kop">
      <h3 id="tx-prompttitel"></h3>
      <button class="modal-close" aria-label="close" onclick="sluitModal('prompt-modal')">&times;</button>
    </div>
    <p class="plak-instructie" id="tx-plakinstructie"></p>
    <textarea class="prompt-tekst" id="prompt-tekst" readonly></textarea>
    <button class="kopieer-btn" id="btn-kopieer" style="margin-top:12px;" onclick="kopieerPrompt()"></button>
  </div>
</div>

const ICONEN = {feit:'📌', redenering:'🧠', interpretatie:'🔎'};

function bouwTaalRij(){
  const t = TR[huidigeTaal];
  const el = document.getElementById('taal-rij');
  let html = TALEN.map(taal =>
    '<button class="taal-btn'+(taal.code===huidigeTaal?' active':'')+'" aria-label="'+taal.naam+'" onclick="setTaal(\''+taal.code+'\')">'+taal.vlag+'</button>'
  ).join('');
  html += '<button class="taal-btn meer" aria-label="'+t.meerTalen+'" onclick="openModal(\'vertaal-modal\')">🏳️<span class="badge">?</span></button>';
  el.innerHTML = html;
}

function setTaal(code){
  huidigeTaal = code;
  document.documentElement.lang = code;
  render();
}

function render(){
  const t = TR[huidigeTaal];
  bouwTaalRij();
  document.getElementById('tx-tagline').textContent = t.tagline;
  document.getElementById('tx-disclaimer').textContent = t.disclaimer;
  document.getElementById('tab-voorbeeld').textContent = t.tabs.voorbeeld;
  document.getElementById('tab-nieuw').textContent = t.tabs.nieuw;
  document.getElementById('tab-bib').textContent = t.tabs.bib;
  document.getElementById('tab-over').textContent = t.tabs.over;

  document.getElementById('tx-voorbeeldtitel').textContent = t.voorbeeldTitel;
  document.getElementById('voorbeeld-stelling').textContent = t.stelling;
  renderVoorbeeldLagen(t);

  document.getElementById('tx-nieuwtitel').textContent = t.nieuwTitel;
  document.getElementById('tx-labelstelling').textContent = t.labelStelling;
  document.getElementById('n-stelling').placeholder = t.placeholderStelling;
  document.getElementById('tx-labelfeit').textContent = t.labelFeit;
  document.getElementById('btn-addfeit').textContent = t.addFeit;
  document.getElementById('tx-labelredenering').textContent = t.labelRedenering;
  document.getElementById('btn-addredenering').textContent = t.addRedenering;
  document.getElementById('tx-labelinterpretatie').textContent = t.labelInterpretatie;
  document.getElementById('btn-addinterpretatie').textContent = t.addInterpretatie;
  document.getElementById('btn-bewaar').textContent = t.bewaarKnop;

  document.getElementById('tx-bibtitel').textContent = t.bibTitel;

  document.getElementById('tx-overtitel').textContent = t.overTitel;
  document.getElementById('tx-overp1').textContent = t.overP1;
  document.getElementById('tx-overp2').textContent = t.overP2;
  document.getElementById('tx-overp3').textContent = t.overP3;
  document.getElementById('tx-overp4').textContent = t.overP4;

  document.getElementById('tx-kiestaaltitel').textContent = t.kiesTaalTitel;
  document.getElementById('tx-prompttitel').textContent = t.promptTitel;
  document.getElementById('tx-plakinstructie').textContent = t.plakInstructie;
  document.getElementById('btn-kopieer').textContent = t.kopieerKnop;
  bouwVertaalLijst();

  renderBib();
}

function renderVoorbeeldLagen(t){
  const el = document.getElementById('voorbeeld-lagen');
  let html = '';

  html += '<div class="laag feit"><div class="laag-kop"><span class="icoon">'+ICONEN.feit+'</span>'+t.laagTitels.feit+'</div><div class="laag-body">';
  t.feiten.forEach(f=>{
    html += '<div class="item">'+escapeHtml(f.claim)+'<div class="bron">'+escapeHtml(f.bron)+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="laag redenering"><div class="laag-kop"><span class="icoon">'+ICONEN.redenering+'</span>'+t.laagTitels.redenering+'</div><div class="laag-body">';
  t.redenering.forEach(r=>{
    html += '<div class="item"><span class="label">'+escapeHtml(r.label)+'</span>'+escapeHtml(r.tekst)+
      '<button class="tg-btn" onclick="this.nextElementSibling.classList.toggle(\'open\')">'+t.tegengeluidBtn+'</button>'+
      '<div class="tegengeluid">'+escapeHtml(r.tegen)+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="laag interpretatie"><div class="laag-kop"><span class="icoon">'+ICONEN.interpretatie+'</span>'+t.laagTitels.interpretatie+'</div><div class="laag-body">';
  t.interpretatie.forEach(i=>{
    html += '<div class="item"><span class="label">'+escapeHtml(i.titel)+'</span>'+escapeHtml(i.tekst)+'</div>';
  });
  html += '</div></div>';

  el.innerHTML = html;
}

function toon(id){
  document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelector('nav.tabs button[data-s="'+id+'"]').classList.add('active');
  if(id==='bib') renderBib();
}

function addItem(laag){
  const wrap = document.getElementById('n-'+laag);
  const row = document.createElement('div');
  row.className = 'rij';
  row.innerHTML = '<input type="text"><button class="del" onclick="this.parentElement.remove()">&times;</button>';
  wrap.appendChild(row);
}

function lees(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function schrijf(data){ localStorage.setItem(KEY, JSON.stringify(data)); }

function opslaan(){
  const t = TR[huidigeTaal];
  const stelling = document.getElementById('n-stelling').value.trim();
  if(!stelling){ alert(t.alertLeeg); return; }
  const pak = laag => Array.from(document.querySelectorAll('#n-'+laag+' input')).map(i=>i.value.trim()).filter(Boolean);
  const entry = {
    id: Date.now(),
    stelling,
    feit: pak('feit'),
    redenering: pak('redenering'),
    interpretatie: pak('interpretatie'),
    datum: new Date().toLocaleDateString()
  };
  const data = lees();
  data.unshift(entry);
  schrijf(data);
  document.getElementById('n-stelling').value = '';
  ['feit','redenering','interpretatie'].forEach(l=>document.getElementById('n-'+l).innerHTML='');
  toon('bib');
}

function verwijder(id){ schrijf(lees().filter(e=>e.id!==id)); renderBib(); }

function renderBib(){
  const t = TR[huidigeTaal];
  const data = lees();
  const el = document.getElementById('bib-lijst');
  if(!data.length){ el.innerHTML = '<div class="leeg">'+t.bibLeeg+'</div>'; return; }
  el.innerHTML = data.map(e => (
    '<div class="lib-item">' +
      '<div class="titel">'+escapeHtml(e.stelling)+'</div>' +
      '<div class="meta">'+e.datum+' &middot; '+ICONEN.feit+' '+e.feit.length+' &middot; '+ICONEN.redenering+' '+e.redenering.length+' &middot; '+ICONEN.interpretatie+' '+e.interpretatie.length+'</div>' +
      '<div class="acties"><button onclick="verwijder('+e.id+')">'+t.verwijderKnop+'</button></div>' +
    '</div>'
  )).join('');
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* --- vertaalprompt: afhankelijk van gekozen vlag --- */
function bouwVertaalLijst(){
  const el = document.getElementById('vertaal-lijst');
  el.innerHTML = TALEN_VERTAAL.map(taal =>
    '<button class="taal-lijst-btn" onclick="kiesVertaalTaal(\''+taal.naam+'\')"><span class="vlag">'+taal.vlag+'</span>'+taal.naam+'</button>'
  ).join('');
}

function haalInhoudOp(){
  const t = TR[huidigeTaal];
  const stellingNieuw = document.getElementById('n-stelling').value.trim();
  if(stellingNieuw){
    const pak = laag => Array.from(document.querySelectorAll('#n-'+laag+' input')).map(i=>i.value.trim()).filter(Boolean);
    let s = stellingNieuw+"\n\n";
    s += t.laagTitels.feit+":\n"+pak('feit').map(x=>'- '+x).join('\n')+"\n\n";
    s += t.laagTitels.redenering+":\n"+pak('redenering').map(x=>'- '+x).join('\n')+"\n\n";
    s += t.laagTitels.interpretatie+":\n"+pak('interpretatie').map(x=>'- '+x).join('\n');
    return s;
  }
  let s = t.stelling+"\n\n";
  s += t.laagTitels.feit+":\n"+t.feiten.map(f=>'- '+f.claim).join('\n')+"\n\n";
  s += t.laagTitels.redenering+":\n"+t.redenering.map(r=>'- '+r.label+': '+r.tekst).join('\n')+"\n\n";
  s += t.laagTitels.interpretatie+":\n"+t.interpretatie.map(i=>'- '+i.titel+': '+i.tekst).join('\n');
  return s;
}

function maakPrompt(taalnaam, inhoud){
  return "Vertaal en leg de volgende tekst uit in het "+taalnaam+". Gebruik eenvoudige taal. Neem zelf geen standpunt in en oordeel niet, leg alleen uit wat er staat.\n\nTekst:\n"+inhoud;
}

function kiesVertaalTaal(taalnaam){
  sluitModal('vertaal-modal');
  const inhoud = haalInhoudOp();
  const prompt = maakPrompt(taalnaam, inhoud);
  document.getElementById('prompt-tekst').value = prompt;
  openModal('prompt-modal');
}

function kopieerPrompt(){
  const ta = document.getElementById('prompt-tekst');
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 999999);
  const klaar = () => {
    const t = TR[huidigeTaal];
    const btn = document.getElementById('btn-kopieer');
    const orig = t.kopieerKnop;
    btn.textContent = t.gekopieerd;
    setTimeout(()=>{ btn.textContent = orig; }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(klaar).catch(()=>{
      try{ document.execCommand('copy'); klaar(); }catch(e){}
    });
  } else {
    try{ document.execCommand('copy'); klaar(); }catch(e){}
  }
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function sluitModal(id){ document.getElementById(id).classList.remove('open'); }
